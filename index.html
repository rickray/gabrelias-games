<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4ec5ff">
  <meta name="description" content="Gabrelia's Games — bright tap games for little kids.">
  <title>Gabrelia's Games</title>
  <link rel="stylesheet" href="css/hub.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff6ad5'/%3E%3Ccircle cx='22' cy='24' r='8' fill='%23ffffff' opacity='0.7'/%3E%3C/svg%3E">
</head>
<body>
  <main class="hub">
    <header class="hero">
      <h1>Gabrelia's Games</h1>
    </header>
    <nav class="grid" aria-label="Games">
      <a class="tile tile-bubble" href="games/bubble-zoo/index.html">
        <span class="bubbles" aria-hidden="true">
          <span class="bubble b1"></span>
          <span class="bubble b2"></span>
          <span class="bubble b3"></span>
        </span>
        <span class="tile-art" aria-hidden="true">🐼</span>
        <span class="tile-name">Bubble Zoo</span>
      </a>
      <a class="tile tile-snack" href="games/snack-time/index.html">
        <span class="crumbs" aria-hidden="true">
          <span class="crumb c1"></span>
          <span class="crumb c2"></span>
          <span class="crumb c3"></span>
        </span>
        <span class="tile-art" aria-hidden="true">🍌</span>
        <span class="tile-name">Snack Time</span>
      </a>
      <a class="tile tile-seek" href="games/hide-and-seek/index.html">
        <span class="peeks" aria-hidden="true">
          <span class="peek p1"></span>
          <span class="peek p2"></span>
        </span>
        <span class="tile-art" aria-hidden="true">🦁</span>
        <span class="tile-name">Hide and Seek</span>
      </a>
      <a class="tile tile-train" href="games/zoo-train/index.html">
        <span class="puffs" aria-hidden="true">
          <span class="puff f1"></span>
          <span class="puff f2"></span>
          <span class="puff f3"></span>
        </span>
        <span class="tile-art" aria-hidden="true">🚂</span>
        <span class="tile-name">Zoo Train</span>
      </a>
    </nav>
  </main>
</body>
</html>
